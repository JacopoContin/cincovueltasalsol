<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Cinco Vueltas al Sol — primer post de Instagram</title>
  <desc id="desc">Cada historia merece ser escuchada. Un proyecto para visibilizar la maternidad y paternidad atípica.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#13294b" flood-opacity=".12"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1.1" fill="#13294b" opacity=".035"/>
      <circle cx="23" cy="19" r=".8" fill="#e0877a" opacity=".04"/>
      <circle cx="31" cy="5" r=".7" fill="#13294b" opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>
  <rect width="1080" height="1350" fill="url(#grain)"/>

  <!-- sun / brand motif -->
  <g transform="translate(540 118)">
    <circle r="34" fill="#f2a79c" opacity=".9"/>
    <circle r="16" fill="#f6f1e7"/>
    <g stroke="#e0877a" stroke-width="5" stroke-linecap="round">
      <path d="M0-58V-78"/><path d="M0 58V78"/><path d="M-58 0H-78"/><path d="M58 0H78"/>
      <path d="M-41-41L-55-55"/><path d="M41 41L55 55"/><path d="M41-41L55-55"/><path d="M-41 41L-55 55"/>
    </g>
  </g>

  <text x="540" y="215" text-anchor="middle" fill="#13294b" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="3">CINCO VUELTAS</text>
  <text x="540" y="263" text-anchor="middle" fill="#13294b" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="3">AL SOL</text>
  <text x="540" y="302" text-anchor="middle" fill="#e0877a" font-family="'Trebuchet MS', sans-serif" font-size="19" font-weight="700" letter-spacing="3">MATERNIDAD Y PATERNIDAD ATÍPICA</text>

  <!-- hand-taped kicker -->
  <g transform="translate(92 365) rotate(-1.5)">
    <path d="M0 0H315L331 31L315 62H0L12 31Z" fill="#efc9c2"/>
    <path d="M0 0H315L331 31L315 62H0L12 31Z" fill="none" stroke="#e0877a" stroke-opacity=".12"/>
    <text x="22" y="42" fill="#13294b" font-family="'Trebuchet MS', sans-serif" font-size="24" font-weight="700">UN NUEVO ESPACIO</text>
  </g>

  <text x="90" y="500" fill="#13294b" font-family="Georgia, 'Times New Roman', serif" font-size="73" font-weight="600">
    <tspan x="90" dy="0">Cada historia</tspan>
    <tspan x="90" dy="86">merece ser</tspan>
    <tspan x="90" dy="86">escuchada.</tspan>
  </text>

  <text x="92" y="795" fill="#3a4d6b" font-family="'Trebuchet MS', sans-serif" font-size="27" font-weight="400">
    <tspan x="92" dy="0">Un proyecto para visibilizar, acompañar</tspan>
    <tspan x="92" dy="43">y unir a familias que transitan la</tspan>
    <tspan x="92" dy="43">maternidad y la paternidad atípica.</tspan>
  </text>

  <!-- central hand-drawn landscape -->
  <g transform="translate(0 900)">
    <path d="M0 180 C170 120 260 155 390 105 C520 55 640 92 760 120 C890 150 970 108 1080 74 V450 H0Z" fill="#dfe1d1" opacity=".65"/>
    <path d="M0 260 C180 220 280 250 430 205 C590 158 760 240 910 196 C990 172 1030 180 1080 170 V450 H0Z" fill="#d1d7c4" opacity=".6"/>
    <!-- sun -->
    <circle cx="830" cy="115" r="78" fill="#f2a79c" opacity=".72"/>
    <g stroke="#e0877a" stroke-width="5" stroke-linecap="round" opacity=".65">
      <path d="M830 18V0"/><path d="M830 212v18"/><path d="M733 115h-18"/><path d="M927 115h18"/>
      <path d="M761 46l-14-14"/><path d="M899 184l14 14"/><path d="M899 46l14-14"/><path d="M761 184l-14 14"/>
    </g>

    <!-- family line illustration -->
    <g fill="none" stroke="#13294b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="420" cy="166" r="24"/>
      <path d="M420 191 C397 214 393 258 397 303"/>
      <path d="M399 225 L360 270"/><path d="M400 225 L438 270"/>
      <path d="M400 303 L370 365"/><path d="M400 303 L431 365"/>

      <circle cx="575" cy="157" r="22"/>
      <path d="M575 179 C551 203 550 250 555 292"/>
      <path d="M555 215 L520 261"/><path d="M556 215 L595 260"/>
      <path d="M556 292 L530 355"/><path d="M556 292 L586 355"/>

      <circle cx="492" cy="242" r="17"/>
      <path d="M492 259 C474 277 474 307 477 333"/>
      <path d="M477 280 L451 307"/><path d="M477 280 L504 307"/>
      <path d="M478 333 L463 374"/><path d="M478 333 L493 374"/>

      <path d="M438 270 C451 279 462 284 475 284"/>
      <path d="M520 261 C510 270 501 277 502 282"/>
    </g>
  </g>

  <!-- CTA -->
  <g filter="url(#shadow)">
    <rect x="86" y="1115" width="908" height="112" rx="30" fill="#13294b"/>
  </g>
  <text x="540" y="1162" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="600">Comparte tu testimonio</text>
  <text x="540" y="1201" text-anchor="middle" fill="#f2a79c" font-family="'Trebuchet MS', sans-serif" font-size="21" font-weight="700">y forma parte de esta conversación.</text>

  <text x="540" y="1288" text-anchor="middle" fill="#3a4d6b" font-family="'Trebuchet MS', sans-serif" font-size="19" letter-spacing="2">CINCOVUELTASALSOL.COM</text>
</svg>
